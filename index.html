<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cookies and user-generated content.</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#17171a}body{min-height:100vh}.page{min-height:100vh;background:#fff}.modal{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}.terms-card{width:min(700px,100%);background:#fff;padding:40px 46px}.cookie-icon{font-size:28px;margin-bottom:22px}.terms-card h1{margin:0;font-size:clamp(30px,5vw,48px);line-height:1.12;font-weight:800;letter-spacing:-1.5px}.terms-card h1 span{background:#9147ff;color:#fff;padding:3px 7px;box-decoration-break:clone;-webkit-box-decoration-break:clone}.cookie-summary{color:#55555b;line-height:1.5;font-size:16px;max-width:600px;margin:24px 0 18px}.privacy{background:none;border:0;padding:0;color:#4d4d53;text-decoration:underline;cursor:pointer;font-size:14px}.buttons{display:flex;gap:12px;margin-top:30px}.buttons button{flex:1;border-radius:4px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}.accept{background:#9147ff;color:#fff;border:1px solid #9147ff}.accept:hover{background:#772ce8}.decline{background:#fff;color:#17171a;border:1px solid #b9b9bf}.decline:hover{background:#f4f4f5}
#scare{display:none;position:fixed;inset:0;background:#000;z-index:9999;align-items:center;justify-content:center;overflow:hidden}#scare img{width:100vw;height:100vh;object-fit:cover;object-position:center;filter:contrast(1.15) saturate(.8);animation:shake .055s infinite}.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash .22s 1}.credit{position:fixed;bottom:6px;right:8px;color:#aaa;font-size:10px;z-index:10000}@keyframes shake{0%{transform:scale(1.03) translate(0,0)}25%{transform:scale(1.08) translate(-7px,4px)}50%{transform:scale(1.1) translate(6px,-3px)}75%{transform:scale(1.07) translate(-4px,-5px)}100%{transform:scale(1.03) translate(3px,3px)}}@keyframes flash{0%{opacity:.9}100%{opacity:0}}@media(max-width:600px){.terms-card{padding:28px 22px}.buttons{flex-direction:column}}
</style></head><body><div class="page"></div><div class="modal" id="terms"><div class="terms-card"><div class="cookie-icon">🍪</div><h1>Cookies and user-generated content.</h1><p class="cookie-summary">Cookies help us send you more relevant information based on your activity and preferences.</p><button class="privacy" id="privacy">Privacy Policy</button><div class="buttons"><button class="decline" id="decline">Decline</button><button class="accept" id="accept">Accept</button></div></div></div>
<div id="scare" aria-hidden="true"><img src="https://upload.wikimedia.org/wikipedia/commons/2/2c/Jeff_the_Killer.jpg" alt="Jeff the Killer"><div class="flash"></div><div class="credit">Image: LuxAmber / Wikimedia Commons, CC BY-SA 4.0</div></div>
<script>
const terms=document.getElementById('terms'),scare=document.getElementById('scare');
function makeScream(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),now=c.currentTime,g=c.createGain();g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.32,now+.035);g.gain.exponentialRampToValueAtTime(.001,now+1.7);g.connect(c.destination);const o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(2100,now);o.frequency.exponentialRampToValueAtTime(430,now+1.1);o.connect(g);o.start(now);o.stop(now+1.75);const n=c.createBufferSource(),b=c.createBuffer(1,c.sampleRate*1.5,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.55;n.buffer=b;const ng=c.createGain();ng.gain.setValueAtTime(.001,now);ng.gain.exponentialRampToValueAtTime(.12,now+.03);ng.gain.exponentialRampToValueAtTime(.001,now+1.5);n.connect(ng).connect(c.destination);n.start(now);n.stop(now+1.5)}catch(e){}}
async function trigger(){try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){}terms.style.display='none';scare.style.display='flex';scare.setAttribute('aria-hidden','false');makeScream()}
document.getElementById('accept').onclick=trigger;document.getElementById('decline').onclick=trigger;document.getElementById('privacy').onclick=function(e){e.preventDefault()};
</script>
</body></html>
